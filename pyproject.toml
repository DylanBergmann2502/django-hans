[project]
name = "django-hans"
version = "0.1.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1",
  "celery==5.6.3",
  "coverage==7.17",
  "django==6.0.9",
  "django-allauth[headless]==65.21",
  "django-anymail==15.2",
  "django-celery-beat==2.9",
  "django-cors-headers==4.9",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8",
  "django-environ==0.14",
  "django-extensions==4.1",
  "django-filter==26.2",
  "django-health-check==4.11.1",
  "django-model-utils==5",
  "django-redis==7",
  "django-storages[s3]==1.14.6",
  "django-stubs[compatible-mypy]==6.1.2",
  "django-unfold==0.110",
  "djangorestframework==3.18.3",
  "djangorestframework-stubs==3.18.1",
  "drf-spectacular==0.30",
  "factory-boy==3.3.3",
  "flower==2.2",
  "gunicorn==26.2",
  "hiredis==3.5",
  "ipdb==0.13.13",
  "mypy==2.4",
  "pandas==3.1",
  "pillow==13",
  "pre-commit==4.7",
  "psycopg==3.3.6",
  "pytest==9.1.1",
  "pytest-django==4.14",
  "pytest-sugar==1.1.1",
  "python-slugify==9",
  "redis==8.1",
  "ruff==0.17.2",
  "sentry-sdk==2.73",
  "uvicorn[standard]==0.54",
  "uvicorn-worker==0.4",
  "watchfiles==1.3",
  "werkzeug[watchdog]==3.1.9",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "config/urls.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  # "NPY",
  # "AIR",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  # "ARG", # Unused function argument
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  # "FURB",
  # "LOG",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "COM812", # Trailing comma missing - conflicts with formatter
  "EXE002", # File is executable but no shebang is present — WSL file permission artifact
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
]

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.13"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest]
# ==== pytest ====
ini_options.minversion = "6.0"
ini_options.norecursedirs = [ ".git", ".venv", "node_modules" ]
ini_options.python_files = [
  "test_*.py",
  "tests.py",
]
ini_options.addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"

[tool.coverage]
# ==== Coverage ====
run.include = [ "django_hans/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
