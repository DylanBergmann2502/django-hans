# .github/workflows/ci.yml
name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']
  push:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Backend code quality checks
  backend-code-quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # Backend tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: deploy/local/web.yml
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build the Django container
        run: docker compose build django

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL to be ready
        run: |
          postgres_user="$(awk -F= '/^POSTGRES_USER=/{print $2}' deploy/local/.envs/.postgres)"
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U "$postgres_user" -d django_hans; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Check DB Migrations
        run: docker compose run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose run --rm django python manage.py migrate

      - name: Run Django Tests
        run: docker compose run --rm django pytest

      - name: Tear down the Stack
        if: always()
        run: docker compose down -v --remove-orphans

  # Frontend code quality checks
  frontend-code-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: deploy/local/web.yml
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Build containers
        run: docker compose build django vue

      - name: Install frontend dependencies
        run: docker compose run --rm -v django_hans_local_node_modules:/app/node_modules vue npm ci

      - name: Check frontend formatting
        run: docker compose run --rm -v django_hans_local_node_modules:/app/node_modules vue npm run format:check

      - name: Lint frontend
        run: docker compose run --rm -v django_hans_local_node_modules:/app/node_modules vue npm run lint:check

      - name: Type-check frontend
        run: docker compose run --rm -v django_hans_local_node_modules:/app/node_modules vue npm run type-check

      - name: Tear down containers
        if: always()
        run: docker compose down -v --remove-orphans

  # Frontend tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: deploy/local/web.yml
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Build containers
        run: docker compose build django vue

      - name: Install frontend dependencies
        run: docker compose run --rm -v django_hans_local_node_modules:/app/node_modules vue npm ci

      - name: Run Vue unit tests
        run: docker compose run --rm -v django_hans_local_node_modules:/app/node_modules vue npm run test:unit

      - name: Tear down containers
        if: always()
        run: docker compose down -v --remove-orphans

  # Build check
  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: deploy/local/web.yml
    needs: [backend-code-quality, backend-tests, frontend-code-quality, frontend-tests]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Build Django container
        run: docker compose build django

      - name: Build Vue frontend
        run: docker compose build vue

      - name: Install frontend dependencies
        run: docker compose run --rm -v django_hans_local_node_modules:/app/node_modules vue npm ci

      - name: Build frontend production artifacts
        run: docker compose run --rm -v django_hans_local_node_modules:/app/node_modules vue npm run build

      - name: Check if build artifacts were created
        run: docker compose run --rm -v django_hans_local_node_modules:/app/node_modules vue ls -la dist/

      - name: Tear down containers
        if: always()
        run: docker compose down -v --remove-orphans
